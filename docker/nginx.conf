server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Healthcheck used by Docker; no app routes or API calls involved.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entrypoints must not be cached across new deployments.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Serve JS, icons, assets, WebAssembly, 3D models and PPTX generator.
    location ~* \.(?:js|css|mjs|wasm|json|png|jpg|jpeg|gif|webp|ico|svg|ttf|otf|woff|woff2|glb|gltf|bin)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Flutter uses browser-history routes: redirect unknown routes to index.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
}
